name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run tests
        run: pytest --tb=short --cov=. --cov-report=term-missing -q
        env:
          APP_ENV: test
          JARVIS_API_KEY: ci-test-key-placeholder
          JARVIS_BRIDGE_SECRET: ci-bridge-secret
          JARVIS_SYNC_SECRET: ci-sync-secret
          ALLOWED_ORIGIN: https://kingofyadav.in
          JARVIS_PUBLIC_CHAT: "0"
          DATABASE_URL: ""
          OLLAMA_HOST: http://localhost:11434

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          retention-days: 7
