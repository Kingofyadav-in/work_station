services:
  api:
    build: .
    command: bash scripts/start_api.sh
    env_file:
      - .env
    ports:
      - "127.0.0.1:5051:5050" # changed 5050 → 5051
    volumes:
      - ./logs:/app/logs
      - ./shared/bus:/app/shared/bus
      - ./Kingofyadav:/app/Kingofyadav
      - ./Jarvis:/app/Jarvis
    restart: unless-stopped

  dashboard:
    build: .
    command: bash scripts/start_dashboard.sh
    env_file:
      - .env
    ports:
      - "127.0.0.1:8502:8501" # changed 8501 → 8502
    volumes:
      - ./logs:/app/logs
      - ./shared/bus:/app/shared/bus
      - ./Kingofyadav:/app/Kingofyadav
      - ./Jarvis:/app/Jarvis
    restart: unless-stopped
