# Local development / LAN access nginx config.
# Serves the website preview on :3000 and the Streamlit dashboard on :8080.
# Both bind only to 127.0.0.1 — not exposed publicly.

# ── Website preview (port 3000) ───────────────────────────────────────────────
server {
    listen 127.0.0.1:3000;
    server_name localhost;

    root /home/kingofyadav/HI;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass              http://127.0.0.1:5050;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;
    }
}

# ── Streamlit dashboard (port 8080 → 8501) ───────────────────────────────────
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location / {
        proxy_pass              http://127.0.0.1:8501;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_read_timeout      600s;
    }
}
