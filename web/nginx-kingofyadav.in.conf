# ── Cloudflare origin ──────────────────────────────────────────────────────────
# This server currently runs as an HTTP origin behind Cloudflare.
# Add a separate 443 block only after installing Cloudflare Origin Certificates.

# ── HTTP — port 80 (Cloudflare Flexible mode / health checks) ───────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kingofyadav.in www.kingofyadav.in;

    root  /home/kingofyadav/HI;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────────
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://kingofyadav.in https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://kingofyadav.in https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://kingofyadav.in wss://kingofyadav.in https://formspree.io https://www.googleapis.com https://static.cloudflareinsights.com https://*.cloudflareinsights.com https://*.cloudflare.com; worker-src 'self'; frame-src 'self' https://www.youtube.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ── Static frontend ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── SSE stream ────────────────────────────────────────────────────────────────
    location = /api/events {
        proxy_pass              http://127.0.0.1:5050;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        '';
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1800s;
        proxy_connect_timeout   5s;
        chunked_transfer_encoding on;
    }

    # ── Jarvis REST API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass              http://127.0.0.1:5050;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_read_timeout      75s;
        proxy_connect_timeout   5s;
    }

    # ── Jarvis widget assets ──────────────────────────────────────────────────────
    location /api-static/ {
        alias /home/kingofyadav/jarvis-platform/web/static/;
        add_header Cache-Control "public, max-age=3600";
    }
}
