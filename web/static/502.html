<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="8">
<title>Jarvis — Restarting</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e1117;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
  .card{background:#1a1d23;border:1px solid #2e3140;border-radius:12px;padding:3rem 2.5rem;
        max-width:480px;width:100%;text-align:center}
  .icon{font-size:3rem;margin-bottom:1.5rem;opacity:.9}
  h1{font-size:1.4rem;font-weight:600;margin-bottom:.75rem;letter-spacing:-.01em}
  p{color:#8b8fa8;font-size:.95rem;line-height:1.6;margin-bottom:1.5rem}
  .badge{display:inline-block;background:#2e3140;color:#7c83a0;font-size:.75rem;
         padding:.25rem .75rem;border-radius:999px;letter-spacing:.04em;margin-bottom:2rem}
  .spinner{width:28px;height:28px;border:3px solid #2e3140;border-top-color:#4f8ef7;
           border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{color:#555b72;font-size:.8rem;margin-top:2rem}
</style>
</head>
<body>
<div class="card">
  <div class="icon">J</div>
  <span class="badge">RESTARTING</span>
  <h1>Jarvis is coming back online</h1>
  <p>The dashboard server stopped unexpectedly.<br>systemd is restarting it now — this page refreshes automatically.</p>
  <div class="spinner"></div>
  <p class="hint">Refreshing in 8 seconds &nbsp;·&nbsp; <a href="/" style="color:#4f8ef7;text-decoration:none">reload now</a></p>
</div>
</body>
</html>
