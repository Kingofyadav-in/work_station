# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy for Jarvis API  →  jarvis.kingofyadav.in
#
# Prerequisites:
#   1. Nginx installed:  sudo apt install nginx
#   2. TLS cert issued:  sudo certbot --nginx -d jarvis.kingofyadav.in
#      (certbot will auto-insert ssl_certificate / ssl_certificate_key paths)
#   3. Copy this file:   sudo cp nginx/jarvis.conf /etc/nginx/sites-available/jarvis
#   4. Enable site:      sudo ln -s /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/
#   5. Reload nginx:     sudo nginx -t && sudo systemctl reload nginx
#
# Then set in work_station/.env:
#   ALLOWED_ORIGIN=https://kingofyadav.in
#   JARVIS_PUBLIC_CHAT=1
#   JARVIS_TRUSTED_PROXY_ADDRS=127.0.0.1,::1
#
# And in Profile (Vercel env):
#   JARVIS_API_BASE=https://jarvis.kingofyadav.in
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limit zone — 12 req/min per IP on public routes
limit_req_zone $binary_remote_addr zone=jarvis_public:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=jarvis_api:10m    rate=60r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jarvis.kingofyadav.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main block ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jarvis.kingofyadav.in;

    # TLS — certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/jarvis.kingofyadav.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.kingofyadav.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY                                             always;
    add_header X-Content-Type-Options nosniff                                   always;
    add_header Referrer-Policy strict-origin-when-cross-origin                  always;

    # CORS — allow kingofyadav.in and localhost in dev
    set $cors_origin "";
    if ($http_origin ~* "^https://(kingofyadav\.in|www\.kingofyadav\.in)$") {
        set $cors_origin $http_origin;
    }
    # Uncomment for local dev:
    # if ($http_origin ~* "^http://localhost:[0-9]+$") { set $cors_origin $http_origin; }

    # ── Static widget (served by Nginx for low latency) ───────────────────────
    location /api-static/ {
        alias /home/kingofyadav/dev/projects/work_station/web/static/;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header Access-Control-Allow-Origin *;
        gzip_static on;
    }

    # ── WebSocket endpoints ──────────────────────────────────────────────────
    location ~ ^/api/ws/ {
        limit_req zone=jarvis_public burst=10 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for streaming responses
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # CORS for WebSocket handshake
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # ── Public chat + enquiry + signup (rate-limited) ─────────────────────────
    location ~ ^/api/(jarvis-chat|public-enquiry|public-signup|public-chat) {
        limit_req zone=jarvis_public burst=5 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  75s;
        proxy_send_timeout  75s;
        proxy_connect_timeout 10s;
        client_max_body_size 64k;

        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            return 204;
        }
    }

    # ── Sync API (Phase 5) ────────────────────────────────────────────────────
    location /api/sync/ {
        limit_req zone=jarvis_api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        client_max_body_size 2m;
    }

    # ── All other API routes ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=jarvis_api burst=30 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        client_max_body_size 1m;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5050/health;
        access_log off;
    }

    # Block everything else at the edge
    location / {
        return 404;
    }

    # Logging
    access_log /var/log/nginx/jarvis.access.log combined;
    error_log  /var/log/nginx/jarvis.error.log warn;
}
